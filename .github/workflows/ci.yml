name: CI

on:
  push:
    branches:
      - main
      - "fix/**"
      - "feat/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests, quality, and package install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check src scripts tests
      - name: Tests
        run: pytest --cov=src --cov-report=term-missing
      - name: Build and install project package
        run: |
          python -m pip install --no-deps .
          cd /tmp
          python -c "import src.api; print('Installed package import: OK')"

  docker-smoke:
    name: Docker build and live API smoke test
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install runtime dependencies for smoke model
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Create a small deterministic smoke-test model
        run: |
          mkdir -p models
          python - <<'PY'
          import joblib
          import pandas as pd
          from sklearn.linear_model import LogisticRegression
          from sklearn.pipeline import Pipeline
          from src.preprocess import FEATURES, build_preprocessor

          rows = [
              [25, 50000, 9, 0, 0, 40, "Private", "HS-grad", "Never-married", "Handlers-cleaners", "Not-in-family", "White", "Male", "United-States"],
              [52, 150000, 13, 5000, 0, 50, "Self-emp-not-inc", "Bachelors", "Married-civ-spouse", "Exec-managerial", "Husband", "White", "Male", "United-States"],
              [31, 70000, 10, 0, 0, 35, "Private", "Some-college", "Divorced", "Sales", "Unmarried", "Black", "Female", "United-States"],
              [46, 120000, 14, 10000, 0, 60, "Local-gov", "Masters", "Married-civ-spouse", "Prof-specialty", "Wife", "Asian-Pac-Islander", "Female", "India"],
          ]
          frame = pd.DataFrame(rows, columns=FEATURES)
          labels = [0, 1, 0, 1]
          pipeline = Pipeline([
              ("preprocessor", build_preprocessor()),
              ("classifier", LogisticRegression(max_iter=500, random_state=42)),
          ])
          pipeline.fit(frame, labels)
          joblib.dump(pipeline, "models/adult_income_pipeline.joblib")
          PY
      - name: Build Docker image
        run: docker build --tag adult-income-api:smoke .
      - name: Run container with mounted model
        run: |
          docker run --detach --name adult-income-api-smoke \
            --publish 127.0.0.1:8000:8000 \
            --env MODEL_PATH=/app/models/adult_income_pipeline.joblib \
            --volume "$PWD/models:/app/models:ro" \
            adult-income-api:smoke
      - name: Verify readiness and real prediction endpoint
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/ready; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8000/health
          curl --fail --silent http://127.0.0.1:8000/ready
          curl --fail --silent \
            --header "Content-Type: application/json" \
            --data '{"age":39,"workclass":"State-gov","fnlwgt":77516,"education":"Bachelors","education-num":13,"marital-status":"Never-married","occupation":"Adm-clerical","relationship":"Not-in-family","race":"White","sex":"Male","capital-gain":2174,"capital-loss":0,"hours-per-week":40,"native-country":"United-States"}' \
            http://127.0.0.1:8000/predict
      - name: Show container logs on failure
        if: failure()
        run: docker logs adult-income-api-smoke
      - name: Remove smoke-test container
        if: always()
        run: docker rm --force adult-income-api-smoke || true
