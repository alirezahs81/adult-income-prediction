version: '3.8'

services:
  api:
    build: .
    container_name: adult-income-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - PORT=8000
    volumes:
      - ./models:/app/models:ro
      - ./data/processed:/app/data/processed:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Optional: Add a simple test service
  test:
    build: .
    container_name: adult-income-test
    depends_on:
      api:
        condition: service_healthy
    command: >
      sh -c "
      pip install --no-cache-dir pytest requests &&
      python -c '
import requests
import time
time.sleep(2)
response = requests.get("http://api:8000/health")
print(f"Health check: {response.status_code} - {response.json()}")
response = requests.post("http://api:8000/predict", json={
    "age": 39,
    "workclass": "State-gov",
    "fnlwgt": 77516,
    "education": "Bachelors",
    "education-num": 13,
    "marital-status": "Never-married",
    "occupation": "Adm-clerical",
    "relationship": "Not-in-family",
    "race": "White",
    "sex": "Male",
    "capital-gain": 2174,
    "capital-loss": 0,
    "hours-per-week": 40,
    "native-country": "United-States"
})
print(f"Prediction: {response.status_code} - {response.json()}")
assert response.status_code == 200
assert "prediction" in response.json()
print("All tests passed!")
"
    '
    restart: "no"