services:
  api:
    build: .
    container_name: adult-income-api
    ports:
      - "8000:8000"
    environment:
      MODEL_PATH: /app/models/adult_income_pipeline.joblib
      PYTHONPATH: /app
    volumes:
      - ./models:/app/models:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8000/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
